<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Clash 3D</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#0b1020; font-family:system-ui,sans-serif; color:#fff; }
  canvas { display:block; cursor:crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

const WORLD_R = 2200, FOOD_COUNT = 500, BOT_COUNT = 14, SHRUB_COUNT = 30, CACTUS_COUNT = 18, CACTUS_R = 22, CACTUS_H = 95, CACTUS_LOSS = 6, CACTUS_KILLS = 20, CACTUS_BUSH_GAP = 300, BLANKET_COUNT = 12, BLANKET_R = 34, SLEEP_TIME = 10, GIFT_COUNT = 10, GIFT_R = 20, DISCO_COUNT = 6, DISCO_R = 24, DANCE_TIME = 15, INTRO_WORK = 3, INTRO_NAP = 3;
// Fruit points = v * 5 (a snake segment is worth 10 points, and each fruit gives v/2 segments)
const FRUITS = {
  apple:  {v: 2, n: 35, r: 10, color: '#ef4444'},   // 10 points
  orange: {v: 3, n: 25, r: 11, color: '#fb923c'},   // 15 points
  mango:  {v: 4, n: 15, r: 13, color: '#fbbf24'},   // 20 points
};
const BASE_SPEED = 85, BOOST_SPEED = 160, TURN = 3.6, MIN_BOOST_LEN = 12;
const SPEED_MS = 1;   // your snake: milliseconds it takes to move 1 pixel (smaller = faster; about 12 is the old speed)
const COLORS = ['#34d399','#f87171','#60a5fa','#fbbf24','#c084fc','#f472b6','#2dd4bf','#fb923c','#a3e635','#38bdf8'];
const NAMES = ['Viper','Mamba','Cobra','Slinky','Noodle','Python','Rattler','Asp','Boa','Fang','Zig','Zag','Nagini','Basil','Hiss','Coil'];

// Skins: body colors repeat along the snake in this order (head first)
function hsl(h) {
  const sat = .85, l = .55, a = sat * Math.min(l, 1 - l);
  const f = n => { const k = (n + h/30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4);
}
const SKINS = [
  {name: 'Rainbow',    palette: Array.from({length: 12}, (_, i) => hsl(i * 30))},
  {name: 'Gold',       palette: ['#fbbf24', '#f59e0b', '#fde68a']},
  {name: 'Ice',        palette: ['#67e8f9', '#a5f3fc', '#e0f2fe']},
  {name: 'Lava',       palette: ['#ef4444', '#f97316', '#fbbf24']},
  {name: 'Galaxy',     palette: ['#7c3aed', '#4c1d95', '#312e81', '#a78bfa']},
  {name: 'Candy',      palette: ['#ef4444', '#ffffff']},
  {name: 'Zebra',      palette: ['#111827', '#f9fafb']},
  {name: 'Bubblegum',  palette: ['#f9a8d4', '#93c5fd']},
];

let introT = 0;
let shrubs = [], cacti = [], hazards = [], blankets = [], gifts = [], discos = [], pops = [], deathMsg = 'You got clashed!';
let best = 0;
try { best = +localStorage.getItem('clash-best') || 0; } catch (e) {}

let snakes, foods, player, mouse = {x:0, y:0, down:false}, state = 'menu', last = 0, cam = {x:0, y:0};

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const normAngle = a => { while (a > Math.PI) a -= 2*Math.PI; while (a < -Math.PI) a += 2*Math.PI; return a; };

function randomPointInWorld(margin = 200) {
  const r = Math.sqrt(Math.random()) * (WORLD_R - margin), a = rand(0, Math.PI*2);
  return {x: Math.cos(a)*r, y: Math.sin(a)*r};
}

// A random spot that isn't inside a shrub
function freeSpot(margin, clear) {
  let p;
  for (let i = 0; i < 30; i++) {
    p = randomPointInWorld(margin);
    if (hazards.every(sh => Math.hypot(sh.x - p.x, sh.y - p.y) > sh.r + clear)) break;
  }
  return p;
}

function makeShrubs() {
  const list = [];
  for (let i = 0; i < SHRUB_COUNT; i++) {
    for (let t = 0; t < 30; t++) {
      const p = randomPointInWorld(150), r = rand(28, 48);
      if (Math.hypot(p.x, p.y) < 650) continue;   // keep the start area clear
      if (list.some(o => Math.hypot(o.x - p.x, o.y - p.y) < o.r + r + 40)) continue;
      list.push({x: p.x, y: p.y, r}); break;
    }
  }
  return list;
}

function makeCacti() {
  const list = [];
  for (let i = 0; i < CACTUS_COUNT; i++) {
    for (let t = 0; t < 80; t++) {
      const p = randomPointInWorld(150);
      if (Math.hypot(p.x, p.y) < 650) continue;
      if (shrubs.some(o => Math.hypot(o.x - p.x, o.y - p.y) < o.r + CACTUS_R + CACTUS_BUSH_GAP)) continue;
      if (list.some(o => Math.hypot(o.x - p.x, o.y - p.y) < CACTUS_R * 2 + 60)) continue;
      list.push({x: p.x, y: p.y, r: CACTUS_R}); break;
    }
  }
  return list;
}

// A blanket on the floor: touch it and you fall asleep. Used blankets reappear somewhere else.
function newBlanket() {
  let p;
  for (let i = 0; i < 30; i++) { p = freeSpot(150, 60); if (Math.hypot(p.x, p.y) > 600) break; }
  return {x: p.x, y: p.y, r: BLANKET_R, a: rand(0, Math.PI), color: pick(['#f472b6','#60a5fa','#fbbf24','#a78bfa','#34d399'])};
}

function newDisco() {
  const p = freeSpot(150, 50);
  return {x: p.x, y: p.y, r: DISCO_R, ph: rand(0, 6)};
}

function newGift() {
  const p = freeSpot(150, 50);
  return {x: p.x, y: p.y, r: GIFT_R, color: pick(['#ef4444','#3b82f6','#a855f7','#10b981','#f59e0b']), ph: rand(0, 6)};
}

function makeSnake(name, color, bot, len = 10) {
  const p = freeSpot(500, 120), angle = rand(0, Math.PI*2);
  const segs = [];
  for (let i = 0; i < len; i++) segs.push({x: p.x - Math.cos(angle)*i*8, y: p.y - Math.sin(angle)*i*8});
  return {name, color, bot, segs, angle, target: angle, grow: 0, boost: false, boostAcc: 0,
          alive: true, wander: rand(-1, 1), think: 0, goal: null, kills: 0, sleep: 0, wary: Math.random() < 0.6,
          palette: [shade(color, -18), color], skinName: null, dance: 0};
}

const radius = s => 7 + Math.min(10, s.segs.length / 25);
const spacing = s => radius(s) * 0.7;
const score = s => Math.floor(s.segs.length * 10 + s.grow * 10);

function spawnFood(x, y, v, color) {
  foods.push({x, y, v, color: color || pick(COLORS)});
}
function fillFood() {
  let pellets = 0; const have = {};
  for (const f of foods) { if (f.kind) have[f.kind] = (have[f.kind] || 0) + 1; else if (!f.drop) pellets++; }
  for (; pellets < FOOD_COUNT; pellets++) {
    const p = freeSpot(60, 20);
    foods.push({x:p.x, y:p.y, v: rand(0.4, 1), color: pick(COLORS)});
  }
  for (const k in FRUITS) {
    for (let n = have[k] || 0; n < FRUITS[k].n; n++) {
      const p = freeSpot(120, 30);
      foods.push({x:p.x, y:p.y, v: FRUITS[k].v, color: FRUITS[k].color, kind: k});
    }
  }
}

function start() {
  snakes = []; foods = []; shrubs = makeShrubs(); cacti = makeCacti(); hazards = shrubs.concat(cacti); pops = [];
  blankets = []; for (let i = 0; i < BLANKET_COUNT; i++) blankets.push(newBlanket());
  gifts = []; for (let i = 0; i < GIFT_COUNT; i++) gifts.push(newGift());
  discos = []; for (let i = 0; i < DISCO_COUNT; i++) discos.push(newDisco());
  player = makeSnake('You', '#34d399', false, 12);
  player.segs.forEach(s => { s.x *= 0.3; s.y *= 0.3; });
  snakes.push(player);
  for (let i = 0; i < BOT_COUNT; i++) snakes.push(makeSnake(pick(NAMES), pick(COLORS), true, Math.floor(rand(8, 30))));
  fillFood();
  state = 'intro'; introT = 0;   // every game starts at the office
}

function kill(s, killer, why) {
  s.alive = false;
  if (killer) killer.kills++;
  for (let i = 0; i < s.segs.length; i += 2) {
    const g = s.segs[i];
    const f = {x: g.x + rand(-8, 8), y: g.y + rand(-8, 8), v: 1.5, color: s.color, drop: true};
    foods.push(f);
  }
  if (s === player) {
    state = 'dead';
    deathMsg = why === 'bush' ? 'Ouch! Prickly bush 🌿' : why === 'wall' ? 'You hit the wall!' : 'You got clashed!';
    const sc = score(s);
    if (sc > best) { best = sc; try { localStorage.setItem('clash-best', best); } catch (e) {} }
  }
}

// Turn away from anything in the list that is close ahead; returns true if it steered
function dodge(s, list, head, px, py, r) {
  for (const sh of list) {
    const dx = sh.x - head.x, dy = sh.y - head.y;
    if (Math.hypot(sh.x - px, sh.y - py) < sh.r + r + 45 || Math.hypot(dx, dy) < sh.r + r + 60) {
      const cross = Math.cos(s.angle) * dy - Math.sin(s.angle) * dx;
      s.target = s.angle + (cross > 0 ? -1.4 : 1.4);
      return true;
    }
  }
  return false;
}

// Touching a cactus cuts you shorter (and scatters pellets); the player also scores kills
function hurtByCactus(s) {
  s.cd = 1.5;
  const lose = Math.max(0, Math.min(CACTUS_LOSS, s.segs.length - 6));
  for (let i = 0; i < lose; i++) {
    const t = s.segs.pop();
    foods.push({x: t.x + rand(-10, 10), y: t.y + rand(-10, 10), v: 0.8, color: s.color, drop: true});
  }
  if (s === player) {
    player.kills += CACTUS_KILLS;
    pops.push({x: s.segs[0].x, y: s.segs[0].y, text: '+' + CACTUS_KILLS + ' kills' + (lose ? '  -' + lose : ''), t: performance.now()});
  }
}

function steerBot(s, dt) {
  s.think -= dt;
  const head = s.segs[0], r = radius(s);
  s.boost = false;

  // Walls: turn back toward the center
  const dc = Math.hypot(head.x, head.y);
  if (dc > WORLD_R - 250) { s.target = Math.atan2(-head.y, -head.x); s.boost = false; return; }

  // Avoid other bodies directly ahead
  const look = 70 + r * 2;
  const px = head.x + Math.cos(s.angle) * look, py = head.y + Math.sin(s.angle) * look;
  for (const o of snakes) {
    if (o === s || !o.alive) continue;
    const orad = radius(o) + r;
    for (let i = 0; i < o.segs.length; i += 2) {
      const g = o.segs[i];
      if (Math.hypot(g.x - px, g.y - py) < orad + 20) {
        s.target = s.angle + (Math.sin(i) > 0 ? 1.6 : -1.6);
        return;
      }
    }
  }

  if (dodge(s, hazards, head, px, py, r) || (s.wary && dodge(s, blankets, head, px, py, r))) return;

  if (s.think <= 0) {
    s.think = rand(0.25, 0.5);
    s.goal = null;
    let bestD = 1e9;
    // Hunt a smaller snake's head if it's close
    for (const o of snakes) {
      if (o === s || !o.alive || o.segs.length > s.segs.length * 0.8) continue;
      const d = Math.hypot(o.segs[0].x - head.x, o.segs[0].y - head.y);
      if (d < 350 && d < bestD) { bestD = d; s.goal = {x: o.segs[0].x + Math.cos(o.angle)*90, y: o.segs[0].y + Math.sin(o.angle)*90, hunt: d}; }
    }
    if (!s.goal) {
      bestD = 350;
      for (const f of foods) {
        const d = Math.hypot(f.x - head.x, f.y - head.y);
        if (d < bestD) { bestD = d; s.goal = f; }
      }
    }
    s.wander = rand(-1, 1);
  }
  if (s.goal) {
    s.target = Math.atan2(s.goal.y - head.y, s.goal.x - head.x);
    if (s.goal.hunt && s.goal.hunt < 260 && s.segs.length > MIN_BOOST_LEN + 4) s.boost = true;
  } else {
    s.target = s.angle + s.wander * 0.8;
  }
}

function update(dt) {
  // Player steering
  player.boost = mouse.down && player.segs.length > MIN_BOOST_LEN;

  for (const s of snakes) {
    if (!s.alive) continue;
    if (s.dance > 0) s.dance = Math.max(0, s.dance - dt);
    if (s.sleep > 0) {                       // asleep: frozen until the timer runs out
      s.sleep -= dt; s.boost = false;
      if (s.sleep <= 0) { s.sleep = 0; s.target = s.angle; }
      continue;
    }
    if (s.bot) steerBot(s, dt);
    if (s.boost && s.segs.length <= MIN_BOOST_LEN) s.boost = false;

    s.angle = normAngle(s.angle + Math.max(-TURN*dt, Math.min(TURN*dt, normAngle(s.target - s.angle))));
    const speed = s.bot ? (s.boost ? BOOST_SPEED : BASE_SPEED) : (1000 / SPEED_MS) * (s.boost ? 1.9 : 1);
    const head = s.segs[0];
    head.x += Math.cos(s.angle) * speed * dt;
    head.y += Math.sin(s.angle) * speed * dt;

    // Body follows
    const sp = spacing(s);
    for (let i = 1; i < s.segs.length; i++) {
      const p = s.segs[i-1], c = s.segs[i];
      const dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx, dy);
      if (d > sp) { c.x = p.x - dx/d*sp; c.y = p.y - dy/d*sp; }
    }

    // Boosting burns length, leaving pellets behind
    if (s.boost) {
      s.boostAcc += dt;
      if (s.boostAcc > 0.12) {
        s.boostAcc = 0;
        const t = s.segs.pop();
        spawnFood(t.x, t.y, 0.6, s.color);
        foods[foods.length-1].drop = true;
      }
    }

    // Growth
    while (s.grow >= 1) {
      const t = s.segs[s.segs.length-1];
      s.segs.push({x: t.x, y: t.y}); s.grow -= 1;
    }

    // Eat
    const eatR = radius(s) + 12;
    for (let i = foods.length - 1; i >= 0; i--) {
      const f = foods[i];
      if (Math.abs(f.x - head.x) < eatR && Math.abs(f.y - head.y) < eatR && Math.hypot(f.x - head.x, f.y - head.y) < eatR) {
        s.grow += f.v * 0.5;
        if (f.kind && s === player) pops.push({x: f.x, y: f.y, text: '+' + f.v * 5, color: f.color, t: performance.now()});
        foods.splice(i, 1);
      }
    }
  }

  // Collisions (after everyone moved)
  for (const s of snakes) {
    if (!s.alive) continue;
    const h = s.segs[0], r = radius(s);
    if (Math.hypot(h.x, h.y) > WORLD_R) { kill(s, null, 'wall'); continue; }
    if (shrubs.some(sh => Math.hypot(sh.x - h.x, sh.y - h.y) < sh.r * 0.85 + r * 0.5)) { kill(s, null, 'bush'); continue; }
    if (!s.sleep) {
      const bi = blankets.findIndex(b => Math.hypot(b.x - h.x, b.y - h.y) < b.r + r * 0.3);
      if (bi >= 0) {
        s.sleep = SLEEP_TIME; s.boost = false;
        if (s === player) pops.push({x: h.x, y: h.y, text: '😴 Zzz…', t: performance.now()});
        blankets[bi] = newBlanket();
      }
    }
    if (!s.sleep) {
      const gi = gifts.findIndex(g => Math.hypot(g.x - h.x, g.y - h.y) < g.r + r);
      if (gi >= 0) {
        const skin = pick(SKINS.filter(k => k.name !== s.skinName));
        s.palette = skin.palette; s.skinName = skin.name;
        if (s === player) pops.push({x: h.x, y: h.y, text: '🎁 ' + skin.name + ' skin!', t: performance.now()});
        gifts[gi] = newGift();
      }
    }
    if (!s.sleep) {
      const di = discos.findIndex(d => Math.hypot(d.x - h.x, d.y - h.y) < d.r + r);
      if (di >= 0) {
        s.dance = DANCE_TIME;
        if (s === player) pops.push({x: h.x, y: h.y, text: '🕺 Dance party!', t: performance.now()});
        discos[di] = newDisco();
      }
    }
    s.cd = Math.max(0, (s.cd || 0) - dt);
    if (!s.cd && cacti.some(c => Math.hypot(c.x - h.x, c.y - h.y) < c.r * 0.8 + r * 0.5)) hurtByCactus(s);
    for (const o of snakes) {
      if (o === s || !o.alive) continue;
      const lim = radius(o) + r * 0.6;
      let hit = false;
      for (let i = 1; i < o.segs.length; i++) {
        const g = o.segs[i];
        if (Math.abs(g.x - h.x) < lim && Math.abs(g.y - h.y) < lim && Math.hypot(g.x - h.x, g.y - h.y) < lim) { hit = true; break; }
      }
      if (hit) { kill(s, o); break; }
    }
  }

  // Replace dead bots, keep pellets topped up, drop stale death-pellets cap
  snakes = snakes.filter(s => s.alive || s === player);
  while (snakes.filter(s => s.bot).length < BOT_COUNT) snakes.push(makeSnake(pick(NAMES), pick(COLORS), true, Math.floor(rand(8, 20))));
  fillFood();
}

// ---------- drawing ----------
function drawSnake(s) {
  const r = radius(s);
  for (let i = s.segs.length - 1; i >= 0; i--) {
    const g = s.segs[i];
    ctx.fillStyle = i % 2 ? s.color : shade(s.color, -18);
    ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, Math.PI*2); ctx.fill();
  }
  const h = s.segs[0], ex = Math.cos(s.angle + Math.PI/2), ey = Math.sin(s.angle + Math.PI/2);
  for (const side of [-1, 1]) {
    const x = h.x + Math.cos(s.angle) * r * 0.35 + ex * r * 0.5 * side, y = h.y + Math.sin(s.angle) * r * 0.35 + ey * r * 0.5 * side;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r * 0.32, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + Math.cos(s.angle)*r*0.1, y + Math.sin(s.angle)*r*0.1, r * 0.16, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = '12px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(s.name, h.x, h.y - r - 8);
}
const shadeCache = {};
function shade(hex, amt) {
  const k = hex + amt; if (shadeCache[k]) return shadeCache[k];
  const n = parseInt(hex.slice(1), 16);
  const c = v => Math.max(0, Math.min(255, v + amt));
  return shadeCache[k] = `rgb(${c(n>>16)},${c((n>>8)&255)},${c(n&255)})`;
}

// ---------- 3D chase camera (phase 1) ----------
const CAM_BACK = 150, FOCAL = 480, NEAR = 30, PITCH = 0.9, COS_P = Math.cos(PITCH), SIN_P = Math.sin(PITCH);
let camAngle = 0, cam3 = {x:0, y:0, fx:1, fy:0, rx:0, ry:1, horizon:0, cy:0, h:400};

function project(x, y, z) {
  const dx = x - cam3.x, dy = y - cam3.y, h = z - cam3.h;
  const d = dx*cam3.fx + dy*cam3.fy, side = dx*cam3.rx + dy*cam3.ry;
  const depth = d*COS_P - h*SIN_P, up = d*SIN_P + h*COS_P;
  if (depth < NEAR) return null;
  const k = FOCAL / depth;
  return {x: W/2 + side*k, y: cam3.cy - up*k, k, depth};
}

function line3(x1, y1, x2, y2) {
  const a = project(x1, y1, 0), b = project(x2, y2, 0);
  if (!a || !b) return;
  ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
}

function sphere(px, py, pr, color) {
  const g = ctx.createRadialGradient(px - pr*.35, py - pr*.35, pr*.1, px, py, pr);
  g.addColorStop(0, shade(color, 60)); g.addColorStop(1, shade(color, -40));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI*2); ctx.fill();
}

function drawMango(px, py, pr) {
  ctx.fillStyle = 'rgba(251,191,36,.18)'; ctx.beginPath(); ctx.arc(px, py, pr*1.7, 0, Math.PI*2); ctx.fill();
  ctx.save(); ctx.translate(px, py); ctx.rotate(-0.45); ctx.scale(1.3, 1);
  const g = ctx.createRadialGradient(-pr*.35, -pr*.35, pr*.1, 0, 0, pr);
  g.addColorStop(0, '#fde047'); g.addColorStop(.55, '#fb923c'); g.addColorStop(1, '#dc2626');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, pr, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.ellipse(px + pr*.25, py - pr*1.05, pr*.55, pr*.22, -0.6, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#78350f'; ctx.lineWidth = Math.max(1, pr*.12); ctx.beginPath(); ctx.moveTo(px, py - pr*.85); ctx.lineTo(px + pr*.05, py - pr*1.1); ctx.stroke();
}

function drawFruit(kind, px, py, pr) {
  ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.beginPath(); ctx.arc(px, py, pr*1.6, 0, Math.PI*2); ctx.fill();
  if (kind === 'mango') return drawMango(px, py, pr);
  sphere(px, py, pr, kind === 'apple' ? '#ef4444' : '#fb923c');
  ctx.fillStyle = '#16a34a';
  if (kind === 'apple') { ctx.beginPath(); ctx.ellipse(px + pr*.35, py - pr*1.05, pr*.4, pr*.18, -0.5, 0, Math.PI*2); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(px, py - pr*.85, pr*.14, 0, Math.PI*2); ctx.fill(); }
}

function pill(cx, yTop, yBot, w) {
  ctx.beginPath(); ctx.arc(cx, yTop + w/2, w/2, Math.PI, 0);
  ctx.lineTo(cx + w/2, yBot); ctx.lineTo(cx - w/2, yBot); ctx.closePath(); ctx.fill();
}

function drawCactus(x, y) {
  const b = project(x, y, 0), t = project(x, y, CACTUS_H); if (!b || !t) return;
  const k = b.k, w = 26 * k, hgt = b.y - t.y;
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(b.x, b.y, w * 1.2, w * .38, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#22c55e';
  for (const [side, lo, hi] of [[-1, .45, .78], [1, .32, .6]]) {
    const off = w * 1.05, ay = b.y - hgt * lo, aTop = b.y - hgt * hi, aw = w * .6;
    ctx.fillRect(side > 0 ? b.x : b.x - off, ay - aw / 2, off, aw);
    pill(b.x + side * off, aTop, ay + aw / 2, aw);
  }
  const g = ctx.createLinearGradient(b.x - w/2, 0, b.x + w/2, 0);
  g.addColorStop(0, '#15803d'); g.addColorStop(.5, '#4ade80'); g.addColorStop(1, '#166534');
  ctx.fillStyle = g; pill(b.x, t.y, b.y, w);
  ctx.fillStyle = '#fef9c3';
  for (let j = 1; j < 7; j++) { ctx.beginPath(); ctx.arc(b.x + (j % 2 ? -1 : 1) * w * .18, t.y + hgt * j / 7, Math.max(1, k * 1.3), 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle = '#f472b6'; ctx.beginPath(); ctx.arc(b.x, t.y, w * .2, 0, Math.PI*2); ctx.fill();
}

function drawBlanket(b) {
  const c = Math.cos(b.a), sn = Math.sin(b.a);
  const quad = (hw, hh, z) => [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([u, v]) => project(b.x + u*c - v*sn, b.y + u*sn + v*c, z));
  const poly = pts => { ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.closePath(); ctx.fill(); };
  const outer = quad(46, 32, 1); if (outer.some(q => !q)) return;
  ctx.fillStyle = b.color; poly(outer);
  const inner = quad(38, 24, 1.5); if (inner.some(q => !q)) return;
  ctx.fillStyle = shade(b.color, 50); poly(inner);
  ctx.strokeStyle = shade(b.color, -35); ctx.lineWidth = 2; ctx.beginPath();
  for (const u of [-20, 0, 20]) {
    const a = project(b.x + u*c + 24*sn, b.y + u*sn - 24*c, 2), d = project(b.x + u*c - 24*sn, b.y + u*sn + 24*c, 2);
    if (a && d) { ctx.moveTo(a.x, a.y); ctx.lineTo(d.x, d.y); }
  }
  ctx.stroke();
  const m = project(b.x, b.y, 8);
  if (m) { ctx.font = Math.max(10, 34 * m.k) + 'px serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText('💤', m.x, m.y); }
}

function drawGift(px, py, pr, color) {
  const w = pr * 1.7, x = px - w/2, y = py - w/2;
  ctx.fillStyle = shade(color, 55); ctx.beginPath();                     // lid / top face
  ctx.moveTo(x, y); ctx.lineTo(x + w*.18, y - w*.22); ctx.lineTo(x + w*1.18, y - w*.22); ctx.lineTo(x + w, y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = shade(color, -45); ctx.beginPath();                    // side face
  ctx.moveTo(x + w, y); ctx.lineTo(x + w*1.18, y - w*.22); ctx.lineTo(x + w*1.18, y + w*.78); ctx.lineTo(x + w, y + w); ctx.closePath(); ctx.fill();
  ctx.fillStyle = color; ctx.fillRect(x, y, w, w);                       // front
  ctx.fillStyle = '#fde047';                                             // ribbon
  ctx.fillRect(px - w*.09, y, w*.18, w); ctx.fillRect(x, py - w*.09, w, w*.18);
  ctx.beginPath(); ctx.arc(px - w*.16, y - w*.08, w*.16, 0, Math.PI*2); ctx.arc(px + w*.16, y - w*.08, w*.16, 0, Math.PI*2); ctx.fill();
}

function drawDisco(px, py, pr) {
  const tn = performance.now();
  ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = Math.max(1, pr * .06); ctx.beginPath(); ctx.moveTo(px, py - pr); ctx.lineTo(px, py - pr * 2.3); ctx.stroke();
  sphere(px, py, pr, '#9ca3af');
  ctx.save(); ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI*2); ctx.clip();
  const c = pr / 3;
  for (let gx = -3; gx < 3; gx++) for (let gy = -3; gy < 3; gy++) {
    if (Math.hypot((gx + .5) * c, (gy + .5) * c) > pr * 1.05) continue;
    const lit = (gx + gy + 12 + Math.floor(tn / 120)) % 3 === 0;
    ctx.fillStyle = lit ? hsl((((gx + 3) * 5 + (gy + 3) * 3 + Math.floor(tn / 90)) % 12) * 30) : ((gx + gy) % 2 ? '#e5e7eb' : '#94a3b8');
    ctx.globalAlpha = .9; ctx.fillRect(px + gx * c + .5, py + gy * c + .5, c - 1, c - 1);
  }
  ctx.restore(); ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(px - pr*.35, py - pr*.4, pr*.16, 0, Math.PI*2); ctx.fill();
  ctx.font = Math.max(10, pr) + 'px serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.fillText('✨', px + Math.cos(tn / 300) * pr * 1.5, py + Math.sin(tn / 300) * pr * .8);
  ctx.fillText('✨', px - Math.cos(tn / 300) * pr * 1.5, py - Math.sin(tn / 300) * pr * .8);
}

function drawShrub(px, py, pr, seed) {
  sphere(px, py, pr, '#166534');
  for (let i = 0; i < 7; i++) {
    const a = seed*1.7 + i*0.9, d = pr * (0.3 + 0.4 * ((i*37 + seed*13) % 10) / 10);
    sphere(px + Math.cos(a)*d, py - pr*.15 + Math.sin(a)*d*.5, pr*.42, i % 2 ? '#22c55e' : '#15803d');
  }
  ctx.fillStyle = '#ef4444';
  for (let i = 0; i < 5; i++) {
    const a = seed*2.3 + i*1.3;
    ctx.beginPath(); ctx.arc(px + Math.cos(a)*pr*.6, py - pr*.2 + Math.sin(a)*pr*.3, Math.max(1.5, pr*.07), 0, Math.PI*2); ctx.fill();
  }
}

function draw() {
  const focus = player.alive ? player.segs[0] : cam;
  cam.x += (focus.x - cam.x) * 0.2; cam.y += (focus.y - cam.y) * 0.2;
  camAngle += normAngle((player.alive ? player.angle : camAngle + 0.004) - camAngle) * 0.08;
  cam3.fx = Math.cos(camAngle); cam3.fy = Math.sin(camAngle);
  cam3.rx = -cam3.fy; cam3.ry = cam3.fx;
  cam3.x = cam.x - cam3.fx * CAM_BACK; cam3.y = cam.y - cam3.fy * CAM_BACK;
  cam3.h = 330 + Math.min(200, player.segs.length * 1.5);   // pull up as you grow
  cam3.cy = H * 0.34;
  cam3.horizon = Math.max(0, cam3.cy - FOCAL * Math.tan(PITCH));

  // Sky and ground
  const sky = ctx.createLinearGradient(0, 0, 0, cam3.horizon);
  sky.addColorStop(0, '#05070f'); sky.addColorStop(1, '#1b2a55');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, cam3.horizon + 1);
  const ground = ctx.createLinearGradient(0, cam3.horizon, 0, H);
  ground.addColorStop(0, '#16224a'); ground.addColorStop(1, '#0e1633');
  ctx.fillStyle = ground; ctx.fillRect(0, cam3.horizon, W, H - cam3.horizon);

  // Grid on the floor
  const gs = 100, span = 1600;
  ctx.strokeStyle = 'rgba(140,170,255,.13)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = Math.floor((cam.x - span)/gs)*gs; x < cam.x + span; x += gs) line3(x, cam.y - span, x, cam.y + span);
  for (let y = Math.floor((cam.y - span)/gs)*gs; y < cam.y + span; y += gs) line3(cam.x - span, y, cam.x + span, y);
  ctx.stroke();

  // Arena wall: a glowing ring with a translucent curtain
  const steps = 160;
  ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3; ctx.beginPath();
  for (let i = 0; i < steps; i++) {
    const a1 = i/steps*Math.PI*2, a2 = (i+1)/steps*Math.PI*2;
    line3(Math.cos(a1)*WORLD_R, Math.sin(a1)*WORLD_R, Math.cos(a2)*WORLD_R, Math.sin(a2)*WORLD_R);
  }
  ctx.stroke();
  ctx.fillStyle = 'rgba(239,68,68,.18)';
  for (let i = 0; i < steps; i++) {
    const a1 = i/steps*Math.PI*2, a2 = (i+1)/steps*Math.PI*2;
    const p1 = project(Math.cos(a1)*WORLD_R, Math.sin(a1)*WORLD_R, 0), p2 = project(Math.cos(a2)*WORLD_R, Math.sin(a2)*WORLD_R, 0);
    const t1 = project(Math.cos(a1)*WORLD_R, Math.sin(a1)*WORLD_R, 260), t2 = project(Math.cos(a2)*WORLD_R, Math.sin(a2)*WORLD_R, 260);
    if (!p1 || !p2 || !t1 || !t2) continue;
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(t2.x, t2.y); ctx.lineTo(t1.x, t1.y); ctx.fill();
  }

  for (const b of blankets) {
    if (Math.abs(b.x - cam.x) > span || Math.abs(b.y - cam.y) > span) continue;
    drawBlanket(b);
  }

  // Everything else as depth-sorted spheres, far to near
  const items = [];
  for (const f of foods) {
    if (Math.abs(f.x - cam.x) > span || Math.abs(f.y - cam.y) > span) continue;
    const fr = f.kind && FRUITS[f.kind];
    const bob = fr ? 14 + Math.sin(performance.now()/300 + f.x) * 5 : 5;
    const p = project(f.x, f.y, bob); if (!p) continue;
    items.push({d: p.depth, p, r: fr ? fr.r : 3 + f.v*3, color: f.color, food: true, kind: f.kind, gx: f.x, gy: f.y});
  }
  for (const s of snakes) {
    if (!s.alive) continue;
    const r = radius(s);
    const dancing = s.dance > 0, tn = performance.now();
    for (let i = s.segs.length - 1; i >= 0; i--) {
      const g = s.segs[i];
      let gx = g.x, gy = g.y, gz = r, col = s.palette[i % s.palette.length];
      if (dancing) {
        const nb = s.segs[i - 1], ang = nb ? Math.atan2(nb.y - g.y, nb.x - g.x) : s.angle, off = Math.sin(tn / 140 - i * 0.6) * r * 1.1;
        gx -= Math.sin(ang) * off; gy += Math.cos(ang) * off;
        gz = r + Math.abs(Math.sin(tn / 170 - i * 0.5)) * r * 1.4;
        col = hsl((Math.floor((tn / 12 + i * 22) / 10) * 10) % 360);
      }
      const p = project(gx, gy, gz); if (!p) continue;
      items.push({d: p.depth, p, r, z: gz, color: col, gx, gy, head: i === 0 ? s : null});
    }
  }
  shrubs.forEach((sh, i) => {
    if (Math.abs(sh.x - cam.x) > span || Math.abs(sh.y - cam.y) > span) return;
    const p = project(sh.x, sh.y, sh.r * 0.55); if (p) items.push({d: p.depth, p, r: sh.r, shrub: true, gx: sh.x, gy: sh.y, seed: i});
  });
  for (const g of gifts) {
    if (Math.abs(g.x - cam.x) > span || Math.abs(g.y - cam.y) > span) continue;
    const p = project(g.x, g.y, 24 + Math.sin(performance.now()/350 + g.ph) * 6); if (p) items.push({d: p.depth, p, r: g.r, gift: true, color: g.color, gx: g.x, gy: g.y});
  }
  for (const d of discos) {
    if (Math.abs(d.x - cam.x) > span || Math.abs(d.y - cam.y) > span) continue;
    const p = project(d.x, d.y, 55 + Math.sin(performance.now()/400 + d.ph) * 6); if (p) items.push({d: p.depth, p, r: d.r, disco: true, gx: d.x, gy: d.y});
  }
  for (const c of cacti) {
    if (Math.abs(c.x - cam.x) > span || Math.abs(c.y - cam.y) > span) continue;
    const p = project(c.x, c.y, CACTUS_H * 0.5); if (p) items.push({d: p.depth, p, r: c.r, cactus: true, gx: c.x, gy: c.y});
  }
  items.sort((a, b) => b.d - a.d);

  for (const it of items) {
    const pr = it.r * it.p.k;
    if (pr < 0.6) continue;
    if (it.cactus) { drawCactus(it.gx, it.gy); continue; }
    if (it.disco) {
      const gp = project(it.gx, it.gy, 0);
      if (gp) { ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.beginPath(); ctx.ellipse(gp.x, gp.y, pr*1.1, pr*.4, 0, 0, Math.PI*2); ctx.fill(); }
      drawDisco(it.p.x, it.p.y, pr);
      continue;
    }
    if (it.gift) {
      const gp = project(it.gx, it.gy, 0);
      if (gp) { ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(gp.x, gp.y, pr*.9, pr*.32, 0, 0, Math.PI*2); ctx.fill(); }
      drawGift(it.p.x, it.p.y, pr, it.color);
      ctx.font = Math.max(10, pr * 1.1) + 'px serif'; ctx.textAlign = 'center'; ctx.fillText('✨', it.p.x + pr * 1.1, it.p.y - pr * 1.2);
      continue;
    }
    if (it.shrub) {
      const gp = project(it.gx, it.gy, 0);
      if (gp) { ctx.fillStyle = 'rgba(239,68,68,.22)'; ctx.beginPath(); ctx.ellipse(gp.x, gp.y, pr*1.15, pr*.42, 0, 0, Math.PI*2); ctx.fill(); }
      drawShrub(it.p.x, it.p.y, pr, it.seed);
      continue;
    }
    // Soft shadow on the floor
    if (!it.food) {
      const gp = project(it.gx, it.gy, 0);
      if (gp) { ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(gp.x, gp.y, pr, pr*0.35, 0, 0, Math.PI*2); ctx.fill(); }
    }
    if (it.kind) {
      const gp = project(it.gx, it.gy, 0);
      if (gp) { ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(gp.x, gp.y, pr*.9, pr*.32, 0, 0, Math.PI*2); ctx.fill(); }
      drawFruit(it.kind, it.p.x, it.p.y, pr);
      continue;
    }
    ctx.globalAlpha = it.food ? .95 : 1;
    sphere(it.p.x, it.p.y, pr, it.color);
    ctx.globalAlpha = 1;
    if (it.head) {
      const s = it.head, ex = Math.cos(s.angle + Math.PI/2), ey = Math.sin(s.angle + Math.PI/2);
      for (const side of [-1, 1]) {
        const ep = project(it.gx + Math.cos(s.angle)*it.r*.55 + ex*it.r*.5*side, it.gy + Math.sin(s.angle)*it.r*.55 + ey*it.r*.5*side, (it.z || it.r) + it.r*.25);
        if (!ep) continue;
        if (s.sleep > 0) {
          ctx.strokeStyle = '#111'; ctx.lineWidth = Math.max(1.5, it.r*.1*ep.k); ctx.beginPath();
          ctx.moveTo(ep.x - it.r*.3*ep.k, ep.y); ctx.lineTo(ep.x + it.r*.3*ep.k, ep.y); ctx.stroke();
        } else {
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ep.x, ep.y, it.r*.3*ep.k, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ep.x, ep.y, it.r*.15*ep.k, 0, Math.PI*2); ctx.fill();
        }
      }
      if (s.dance > 0) {
        const tm = performance.now() / 400; ctx.font = Math.max(12, pr * 1.3) + 'px serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.font = 'bold ' + Math.max(11, pr * .95) + 'px system-ui';
        ctx.strokeText('🎤 ♪ Life goes on and on and on and on and on ♪', it.p.x, it.p.y - pr * 4.4); ctx.fillText('🎤 ♪ Life goes on and on and on and on and on ♪', it.p.x, it.p.y - pr * 4.4);
        ctx.font = Math.max(12, pr * 1.3) + 'px serif';
        ['🎵', '🎶', '✨'].forEach((e, j) => ctx.fillText(e, it.p.x + Math.cos(tm + j * 2.1) * pr * 2.3, it.p.y - pr * 1.8 - Math.abs(Math.sin(tm * 1.3 + j)) * pr * 1.8));
      }
      const lp = project(it.gx, it.gy, (it.z || it.r) + it.r*1.6);
      if (lp) { ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = Math.max(10, 13*lp.k*1.6) + 'px system-ui'; ctx.textAlign = 'center'; ctx.fillText(s.name + (s.sleep > 0 ? ' 💤 ' + Math.ceil(s.sleep) + 's' : '') + (s.dance > 0 ? ' 🕺 ' + Math.ceil(s.dance) + 's' : ''), lp.x, lp.y); }
    }
  }

  // Points that float up when you eat a fruit
  const now = performance.now();
  pops = pops.filter(o => now - o.t < 900);
  for (const o of pops) {
    const age = (now - o.t) / 900, p = project(o.x, o.y, 30 + age * 90);
    if (!p) continue;
    ctx.globalAlpha = 1 - age * age;
    ctx.font = 'bold ' + Math.max(22, 34 * p.k * 1.4 * (1 + (1 - age) * .3)) + 'px system-ui'; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.fillStyle = '#fde047';
    ctx.strokeText(o.text, p.x, p.y); ctx.fillText(o.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  if (player.alive && player.sleep > 0 && state === 'play') {
    ctx.fillStyle = 'rgba(10,15,45,.35)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 44px system-ui';
    ctx.fillText('😴 Sleeping… ' + Math.ceil(player.sleep) + 's', W/2, H * 0.22);
    ctx.font = '18px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillText('Watch out — other snakes can run into you!', W/2, H * 0.22 + 30);
  }

  if (player.alive && player.dance > 0 && state === 'play') {
    ctx.globalAlpha = .10; ctx.fillStyle = hsl((Math.floor(now / 150) % 12) * 30); ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.font = 'bold 26px system-ui'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.fillStyle = '#fff';
    const msg = '🎤 Life goes on and on and on and on and on · 🕺 ' + Math.ceil(player.dance) + 's'; ctx.strokeText(msg, W/2, H - 40); ctx.fillText(msg, W/2, H - 40);
  }

  drawHud();
}

// On-screen music button (bottom-left): click or tap it, or press M
const muteBtn = () => ({x: 16, y: H - 58, w: 158, h: 42});
function toggleMute() { muted = !muted; musicMode = 'changed'; }   // the next frame applies it
function drawMuteButton() {
  const b = muteBtn(), r = 12;
  ctx.beginPath(); ctx.moveTo(b.x + r, b.y); ctx.arcTo(b.x + b.w, b.y, b.x + b.w, b.y + b.h, r); ctx.arcTo(b.x + b.w, b.y + b.h, b.x, b.y + b.h, r);
  ctx.arcTo(b.x, b.y + b.h, b.x, b.y, r); ctx.arcTo(b.x, b.y, b.x + b.w, b.y, r); ctx.closePath();
  ctx.fillStyle = muted ? 'rgba(127,29,29,.75)' : 'rgba(0,0,0,.55)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = 'bold 17px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  ctx.fillText(muted ? '🔇 Music off' : '🔊 Music on', b.x + b.w / 2 - 12, b.y + b.h / 2 + 1);
  ctx.font = '12px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.65)'; ctx.fillText('M', b.x + b.w - 16, b.y + b.h / 2 + 1);
  ctx.textBaseline = 'alphabetic';
}
const onMuteBtn = (x, y) => { const b = muteBtn(); return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; };

function drawHud() {
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 22px system-ui';
  ctx.fillText('Score ' + score(player), 20, 36);
  ctx.font = '14px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.fillText('Best ' + Math.max(best, score(player)) + '   Kills ' + player.kills, 20, 58);
  ctx.fillText('Skin: ' + (player.skinName || 'Classic'), 20, 78);

  // Leaderboard
  const top = snakes.filter(s => s.alive).sort((a, b) => score(b) - score(a)).slice(0, 8);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(W - 190, 14, 176, 32 + top.length * 20);
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 14px system-ui'; ctx.fillText('Leaderboard', W - 180, 34);
  ctx.font = '13px system-ui';
  top.forEach((s, i) => {
    ctx.fillStyle = s === player ? '#fbbf24' : 'rgba(255,255,255,.8)';
    ctx.textAlign = 'left'; ctx.fillText((i+1) + '. ' + s.name, W - 180, 56 + i*20);
    ctx.textAlign = 'right'; ctx.fillText(score(s), W - 24, 56 + i*20);
  });

  // Minimap
  const mr = 55, mx = W - 80, my = H - 80;
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#16a34a';
  for (const b of shrubs) { ctx.beginPath(); ctx.arc(mx + b.x/WORLD_R*mr, my + b.y/WORLD_R*mr, 2, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle = '#e5e7eb';
  for (const d of discos) { ctx.beginPath(); ctx.arc(mx + d.x/WORLD_R*mr, my + d.y/WORLD_R*mr, 2.5, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle = '#f472b6';
  for (const g of gifts) { ctx.beginPath(); ctx.arc(mx + g.x/WORLD_R*mr, my + g.y/WORLD_R*mr, 2, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle = '#c4b5fd';
  for (const b of blankets) { ctx.beginPath(); ctx.arc(mx + b.x/WORLD_R*mr, my + b.y/WORLD_R*mr, 2, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle = '#86efac';
  for (const c of cacti) { ctx.beginPath(); ctx.arc(mx + c.x/WORLD_R*mr, my + c.y/WORLD_R*mr, 2, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle = '#fb923c';
  for (const f of foods) if (f.kind === 'mango') { ctx.beginPath(); ctx.arc(mx + f.x/WORLD_R*mr, my + f.y/WORLD_R*mr, 1.6, 0, Math.PI*2); ctx.fill(); }
  for (const s of snakes) {
    if (!s.alive) continue;
    ctx.fillStyle = s === player ? '#fbbf24' : s.color;
    ctx.beginPath(); ctx.arc(mx + s.segs[0].x/WORLD_R*mr, my + s.segs[0].y/WORLD_R*mr, s === player ? 4 : 2.5, 0, Math.PI*2); ctx.fill();
  }

  if (state !== 'play') overlay();
  drawMuteButton();
}

function overlay() {
  ctx.fillStyle = 'rgba(5,8,20,.7)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = 'bold 56px system-ui'; ctx.fillText(state === 'dead' ? deathMsg : 'Snake Clash 3D', W/2, H/2 - 40);
  ctx.font = '20px system-ui';
  if (state === 'dead') ctx.fillText('Score ' + score(player) + '  ·  Kills ' + player.kills + '  ·  Best ' + best, W/2, H/2 + 4);
  else ctx.fillText('Best ' + best, W/2, H/2 + 4);
  ctx.font = '16px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText('Slide left/right on the trackpad to turn · hold click (or Space) to boost', W/2, H/2 + 44);
  ctx.fillText('Eat fruit 🍎🍊🥭 for points · avoid bushes 🌿 · cactus 🌵 shrinks you but gives +20 kills', W/2, H/2 + 68);
  ctx.fillText('Blankets 🛏️ put any snake to sleep for 10 seconds · gifts 🎁 change your skin', W/2, H/2 + 92);
  ctx.fillText('Grab a disco ball ✨ to dance and sing for 15 seconds', W/2, H/2 + 116);
  ctx.fillText('Every game starts at the WORK OFFICE: 3 seconds of work, a 3-second nap, then play!', W/2, H/2 + 140);
  ctx.fillStyle = '#34d399'; ctx.font = 'bold 22px system-ui';
  ctx.fillText('Click or press Enter to ' + (state === 'dead' ? 'play again' : 'play'), W/2, H/2 + 166);
  ctx.font = '14px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillText('Music button is at the bottom-left (or press M)', W/2, H/2 + 192);
}

// ---------- input ----------
const TURN_SENS = 0.006;
function steer(dx) {
  if (state !== 'play' || !player.alive) return;
  // Keep the aim within a quarter turn of the heading so a big swipe can't build up a long spin
  const off = normAngle(player.target - player.angle) + dx * TURN_SENS;
  player.target = normAngle(player.angle + Math.max(-1.4, Math.min(1.4, off)));
}
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; steer(e.movementX); });
let lastTouchAt = -1e9;
addEventListener('mousedown', e => {
  if (performance.now() - lastTouchAt < 800) return;          // a tap already handled this
  if (document.pointerLockElement !== canvas && onMuteBtn(e.clientX, e.clientY)) { unlockAudio(); toggleMute(); return; }
  mouse.down = true; unlockAudio(); if (state === 'menu' || state === 'dead') start();
  try { if (document.pointerLockElement !== canvas) canvas.requestPointerLock(); } catch (e) {}
});
addEventListener('mouseup', () => { mouse.down = false; });
addEventListener('keydown', e => {
  if (e.key === 'Enter') unlockAudio();
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if (e.key === 'Enter' && state === 'intro') introT = INTRO_WORK + INTRO_NAP;     // skip the office
  else if (e.key === 'Enter' && state !== 'play') start();
  if (e.key === ' ') { e.preventDefault(); mouse.down = true; }
});
addEventListener('keyup', e => { if (e.key === ' ') mouse.down = false; });
let lastTouchX = null;
addEventListener('touchmove', e => { const t = e.touches[0]; if (lastTouchX !== null) steer(t.clientX - lastTouchX); lastTouchX = t.clientX; e.preventDefault(); }, {passive:false});
addEventListener('touchend', () => { lastTouchX = null; });
addEventListener('touchstart', e => {
  lastTouchAt = performance.now(); lastTouchX = e.touches[0].clientX; unlockAudio();
  if (onMuteBtn(e.touches[0].clientX, e.touches[0].clientY)) { toggleMute(); lastTouchX = null; return; }
   if (state === 'menu' || state === 'dead') start();
});

// ---------- intro: the office ----------
function drawIntro() {
  const working = introT < INTRO_WORK, tn = performance.now();
  const phaseLen = working ? INTRO_WORK : INTRO_NAP, into = working ? introT : introT - INTRO_WORK;
  const left = Math.max(0, phaseLen - into), u = Math.min(W, H * 1.5) / 800, cx = W / 2;
  const deskTop = H * 0.70, sc = '#34d399';
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
  const ball = (x, y, r, c) => sphere(x, y, r, c);

  // room
  ctx.fillStyle = '#e7e5e4'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#a8a29e'; ctx.fillRect(0, H * 0.66, W, H);
  ctx.fillStyle = '#d6d3d1'; ctx.fillRect(0, H * 0.64, W, H * 0.02);
  // window
  const wx = cx - 340 * u, wy = H * 0.14, ww = 150 * u, wh = 170 * u;
  ctx.fillStyle = working ? '#7dd3fc' : '#1e1b4b'; ctx.fillRect(wx, wy, ww, wh);
  if (!working) { ctx.fillStyle = '#fef9c3'; for (const [a, b] of [[.2,.2],[.6,.35],[.4,.6],[.75,.7],[.25,.8]]) ctx.fillRect(wx + a * ww, wy + b * wh, 3 * u, 3 * u); ctx.font = 40 * u + 'px serif'; ctx.textAlign = 'center'; ctx.fillText('🌙', wx + ww * .65, wy + wh * .3); }
  else { ctx.font = 44 * u + 'px serif'; ctx.textAlign = 'center'; ctx.fillText('☀️', wx + ww * .65, wy + wh * .32); }
  ctx.strokeStyle = '#78350f'; ctx.lineWidth = 6 * u; ctx.strokeRect(wx, wy, ww, wh);
  ctx.beginPath(); ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh); ctx.moveTo(wx, wy + wh / 2); ctx.lineTo(wx + ww, wy + wh / 2); ctx.stroke();
  // WORK OFFICE sign on the wall
  const sw = 300 * u, sh = 70 * u, sx = cx - sw / 2 + 60 * u, sy = H * 0.10;
  ctx.strokeStyle = '#78350f'; ctx.lineWidth = 3 * u; ctx.beginPath(); ctx.moveTo(sx + sw * .2, 0); ctx.lineTo(sx + sw * .2, sy); ctx.moveTo(sx + sw * .8, 0); ctx.lineTo(sx + sw * .8, sy); ctx.stroke();
  rr(sx, sy, sw, sh, 12 * u); ctx.fillStyle = '#fef3c7'; ctx.fill(); ctx.strokeStyle = '#92400e'; ctx.lineWidth = 5 * u; ctx.stroke();
  ctx.fillStyle = '#78350f'; ctx.font = 'bold ' + 34 * u + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('WORK OFFICE', sx + sw / 2, sy + sh / 2 + 2 * u); ctx.textBaseline = 'alphabetic';

  if (working) {
    // desk, monitor, and a hard-working snake
    ctx.fillStyle = '#92400e'; ctx.fillRect(cx - 280 * u, deskTop, 560 * u, 22 * u);
    ctx.fillStyle = '#78350f'; ctx.fillRect(cx - 270 * u, deskTop + 22 * u, 540 * u, H);
    const mx = cx + 150 * u, my = deskTop - 150 * u;
    ctx.fillStyle = '#374151'; ctx.fillRect(mx + 40 * u, deskTop - 30 * u, 30 * u, 30 * u); rr(mx - 10 * u, my, 130 * u, 100 * u, 8 * u); ctx.fill();
    ctx.fillStyle = Math.floor(tn / 250) % 2 ? '#bfdbfe' : '#93c5fd'; ctx.fillRect(mx, my + 8 * u, 110 * u, 84 * u);
    ctx.fillStyle = '#1e3a8a'; for (let i = 0; i < 5; i++) ctx.fillRect(mx + 8 * u, my + (16 + i * 15) * u, (40 + ((i * 37 + Math.floor(tn / 400)) % 5) * 12) * u, 5 * u);
    for (let i = 14; i >= 0; i--) {
      const t = i / 14, x = cx - 220 * u + t * 250 * u, y = deskTop - 15 * u - t * t * t * 40 * u + Math.sin(tn / 90 + i) * 2 * u;
      ball(x, y, 15 * u, i % 2 ? sc : '#10b981');
      if (i === 14) {
        for (const dy of [-6, 6]) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + 6 * u, y - 4 * u + dy * u * .4, 5 * u, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + 8 * u, y - 4 * u + dy * u * .4, 2.4 * u, 0, Math.PI*2); ctx.fill(); }
      }
    }
    ctx.fillStyle = '#fff'; ctx.font = 28 * u + 'px serif'; ctx.textAlign = 'center'; ctx.fillText('⌨️', cx - 40 * u, deskTop - 4 * u);
  } else {
    // lights out: a green, pink and purple bed with a sleeping snake
    ctx.fillStyle = 'rgba(15,23,42,.55)'; ctx.fillRect(0, 0, W, H);
    const bx = cx - 250 * u, by = H * 0.60, bw = 500 * u;
    ctx.fillStyle = '#16a34a'; rr(bx, by, bw, 100 * u, 14 * u); ctx.fill();
    ctx.fillStyle = '#f9a8d4'; rr(bx + 10 * u, by + 10 * u, bw - 20 * u, 62 * u, 10 * u); ctx.fill();
    ctx.fillStyle = '#fbcfe8'; rr(bx + 22 * u, by + 14 * u, 110 * u, 44 * u, 16 * u); ctx.fill();
    for (let i = 0; i < 14; i++) { const x = bx + 120 * u + i * 20 * u, y = by + 40 * u + Math.sin(tn / 500 + i * .4) * 2 * u; ball(x, y, 15 * u, i % 2 ? sc : '#10b981'); }
    ball(bx + 100 * u, by + 36 * u, 17 * u, sc);
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2.5 * u; ctx.beginPath(); ctx.moveTo(bx + 102 * u, by + 30 * u); ctx.lineTo(bx + 114 * u, by + 30 * u); ctx.moveTo(bx + 102 * u, by + 40 * u); ctx.lineTo(bx + 114 * u, by + 40 * u); ctx.stroke();
    ctx.fillStyle = '#7c3aed'; rr(bx + 150 * u, by + 12 * u, bw - 170 * u, 60 * u, 10 * u); ctx.fill();
    ctx.fillStyle = '#86efac'; ctx.fillRect(bx + 150 * u, by + 34 * u, bw - 170 * u, 14 * u);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    for (let i = 0; i < 3; i++) { const k = ((tn / 1200) + i / 3) % 1; ctx.globalAlpha = 1 - k; ctx.font = 'bold ' + (18 + i * 10) * u + 'px system-ui'; ctx.fillText('Z', bx + 130 * u + k * 60 * u + i * 26 * u, by - 10 * u - k * 90 * u); }
    ctx.globalAlpha = 1;
  }

  // caption and progress bar
  ctx.textAlign = 'center'; ctx.fillStyle = working ? '#1c1917' : '#fff';
  ctx.font = 'bold ' + 40 * u + 'px system-ui';
  ctx.fillText(working ? '💼 Working… ' + Math.ceil(left) + 's' : '😴 Nap time… ' + Math.ceil(left) + 's', cx, H * 0.30 + 70 * u);
  ctx.font = 20 * u + 'px system-ui'; ctx.fillStyle = working ? '#57534e' : '#c7d2fe';
  ctx.fillText(working ? 'A snake has to work before it can play.' : 'Sweet dreams! Then it\'s time to play.', cx, H * 0.30 + 100 * u);
  const bw2 = Math.min(420, W * 0.6), bx2 = cx - bw2 / 2, by2 = H - 60;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(bx2, by2, bw2, 10);
  ctx.fillStyle = working ? '#f59e0b' : '#818cf8'; ctx.fillRect(bx2, by2, bw2 * (into / phaseLen), 10);
  ctx.font = '14px system-ui'; ctx.fillStyle = working ? '#57534e' : '#c7d2fe'; ctx.fillText('Press Enter to skip', cx, H - 28);
}

// ---------- music: a calm loop while you play, a disco beat while you dance ----------
// Both are made up in the browser. If a file named life-goes-on.mp3 sits next to this page, it plays for the dance instead.
let audioCtx = null, synthTimer = null, synthMode = null, musicEl = null, musicMissing = false, musicMode = null, muted = false;
function unlockAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
}
function blip(freq, when, dur, type, vol) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, when);
  g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(when); o.stop(when + dur + 0.02);
}
const PLAY_MELODY = [392, 494, 587, 494, 440, 523, 659, 523], PLAY_BASS = [98, 131, 110, 147];
const DISCO_MELODY = [523, 659, 784, 659, 587, 784, 880, 784], DISCO_BASS = [110, 110, 147, 131];
function stopSynth() { if (synthTimer) clearInterval(synthTimer); synthTimer = null; synthMode = null; }
function startSynth(mode) {
  if (!audioCtx || (synthTimer && synthMode === mode)) return;
  stopSynth(); synthMode = mode;
  let step = 0;
  synthTimer = setInterval(() => {
    const t = audioCtx.currentTime + 0.02;
    if (mode === 'disco') {
      if (step % 4 === 0) { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .15); g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.0001, t + .18); o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + .2); }
      if (step % 2 === 1) blip(7000, t, .04, 'square', .03);
      if (step % 4 === 0) blip(DISCO_BASS[(step >> 2) % 4], t, .22, 'sawtooth', .12);
      blip(DISCO_MELODY[step % 8], t, .16, 'triangle', .10);
    } else {
      if (step % 8 === 0) blip(PLAY_BASS[(step >> 3) % 4], t, .9, 'sine', .10);
      blip(PLAY_MELODY[step % 8], t, .3, 'sine', .05);
      if (step % 4 === 2) blip(PLAY_MELODY[(step + 3) % 8] * 2, t, .2, 'triangle', .025);
    }
    step++;
  }, mode === 'disco' ? 230 : 330);
}
// mode: null (silence), 'play' or 'disco'
function setMusic(mode) {
  if (muted) mode = null;
  if (mode === musicMode) return;
  musicMode = mode;
  stopSynth(); if (musicEl) musicEl.pause();
  if (!mode) return;
  if (mode === 'disco' && !musicMissing) {
    const fallback = () => { musicMissing = true; musicEl = null; if (musicMode === 'disco') startSynth('disco'); };
    if (!musicEl) { musicEl = new Audio('life-goes-on.mp3'); musicEl.loop = true; musicEl.addEventListener('error', fallback); }
    musicEl.play().catch(fallback);
  } else startSynth(mode);
}

// ---------- loop ----------
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
  if (state === 'play') update(dt);
  else if (state === 'menu') { for (const s of snakes) if (s.bot) { steerBot(s, dt); } update0(dt); }
  setMusic(state === 'play' && player.alive ? (player.dance > 0 ? 'disco' : 'play') : null);
  if (state === 'intro') {
    introT += dt;
    if (introT >= INTRO_WORK + INTRO_NAP) {
      state = 'play';
      pops.push({x: player.segs[0].x, y: player.segs[0].y, text: '☀️ Good morning! Go play!', t: performance.now()});
    }
  }
  if (state === 'intro') drawIntro(); else draw();
  requestAnimationFrame(frame);
}
// Menu backdrop: let bots roam without a live player
function update0(dt) {
  const keepState = state; state = 'play';
  player.target = player.angle; mouse.x = W/2; mouse.y = H/2;
  update(dt);
  player.alive = false; state = keepState;
}

start(); state = 'menu';
requestAnimationFrame(frame);
</script>
</body>
</html>
