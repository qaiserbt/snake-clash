<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root { --bg:#111827; --panel:#1f2937; --grid:#243041; --snake:#34d399; --head:#10b981; --food:#f87171; --text:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
         background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
  .bar { display:flex; gap:24px; font-size:18px; }
  canvas { background:var(--panel); border-radius:8px; max-width:95vw; height:auto; }
  p { margin:0; opacity:.7; font-size:14px; }
</style>
</head>
<body>
  <div class="bar"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
  <canvas id="c" width="400" height="400"></canvas>
  <p>Arrow keys / WASD to move · Space to pause · Enter to restart</p>

<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const N = 20, S = canvas.width / N;
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
let best = 0;
try { best = +localStorage.getItem('snake-best') || 0; } catch (e) {}
bestEl.textContent = best;

const START_SPEED = 250, SPEEDUP = 50, MIN_SPEED = 50;
let snake, dir, queue, food, score, alive, paused, timer, speed;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; queue = []; score = 0; alive = true; paused = false;
  scoreEl.textContent = 0;
  placeFood();
  speed = START_SPEED;
  setSpeed(speed);
  draw();
}

function setSpeed(ms) {
  clearInterval(timer);
  timer = setInterval(tick, ms);
}

function placeFood() {
  do { food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}

function tick() {
  if (!alive || paused) return;
  if (queue.length) dir = queue.shift();
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
  const willGrow = head.x === food.x && head.y === food.y;
  const body = willGrow ? snake : snake.slice(0, -1);
  if (hitWall || body.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  if (willGrow) {
    score++; scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('snake-best', best); } catch (e) {} }
    placeFood();
    speed = Math.max(MIN_SPEED, speed - SPEEDUP);
    setSpeed(speed);
  } else snake.pop();
  draw();
}

function gameOver() { alive = false; draw(); }

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food');
  ctx.beginPath(); ctx.arc(food.x*S+S/2, food.y*S+S/2, S/2-3, 0, Math.PI*2); ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#10b981' : '#34d399';
    ctx.beginPath(); ctx.roundRect(s.x*S+1, s.y*S+1, S-2, S-2, 5); ctx.fill();
  });
  if (!alive || paused) {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold 32px system-ui'; ctx.fillText(alive ? 'Paused' : 'Game over', canvas.width/2, canvas.height/2 - 8);
    ctx.font = '16px system-ui'; ctx.fillText(alive ? 'Space to resume' : 'Enter to play again', canvas.width/2, canvas.height/2 + 22);
  }
}

const keys = {
  ArrowUp:{x:0,y:-1}, w:{x:0,y:-1}, ArrowDown:{x:0,y:1}, s:{x:0,y:1},
  ArrowLeft:{x:-1,y:0}, a:{x:-1,y:0}, ArrowRight:{x:1,y:0}, d:{x:1,y:0}
};
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'Enter') return reset();
  if (k === ' ') { e.preventDefault(); if (alive) { paused = !paused; draw(); } return; }
  const d = keys[k];
  if (!d) return;
  e.preventDefault();
  const last = queue.length ? queue[queue.length-1] : dir;
  if (d.x === -last.x && d.y === -last.y) return; // no reversing
  if (d.x === last.x && d.y === last.y) return;
  if (queue.length < 3) queue.push(d);
});

reset();
</script>
</body>
</html>
